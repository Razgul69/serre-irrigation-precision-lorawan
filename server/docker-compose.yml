services:
  influxdb:
    image: influxdb:2.7
    container_name: irrigation-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?definir INFLUX_PASSWORD dans .env}
      DOCKER_INFLUXDB_INIT_ORG: ird
      DOCKER_INFLUXDB_INIT_BUCKET: sondes
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?definir INFLUX_TOKEN dans .env}

  nodered:
    image: nodered/node-red:latest
    container_name: irrigation-nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    environment:
      TZ: Europe/Paris
    depends_on:
      - influxdb

  grafana:
    image: grafana/grafana-oss:latest
    container_name: irrigation-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning
      - ../grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?definir GRAFANA_PASSWORD dans .env}
      INFLUX_TOKEN: ${INFLUX_TOKEN:?definir INFLUX_TOKEN dans .env}
    depends_on:
      - influxdb

volumes:
  influxdb_data:
  nodered_data:
  grafana_data:
