[platformio]
default_envs = nano_esp32_serial

; Lecture SEN0308 seule, sortie serie / CSV (calibration + usage filaire)
[env:nano_esp32_serial]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Variante LoRaWAN : Nano ESP32 + module RFM95/SX1276 (brochage dans config.h)
[env:nano_esp32_lorawan]
extends = env:nano_esp32_serial
lib_deps =
    mcci-catena/MCCI LoRaWAN LMIC library@^4.1.1
build_flags =
    ${env:nano_esp32_serial.build_flags}
    -D WITH_LORAWAN=1
    -D ARDUINO_LMIC_PROJECT_CONFIG_H_SUPPRESS=1
    -D CFG_eu868=1
    -D CFG_sx1276_radio=1
    -D hal_init=LMICHAL_init
